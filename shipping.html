<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>胶片装运台</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/shipping.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">寄往外地影院</p>
          <h1>胶片装运台</h1>
        </div>
        <nav class="top-nav">
          <a href="index.html">核对台</a>
          <a class="active" href="shipping.html">装运台</a>
        </nav>
        <div class="hero-stats stats-four">
          <div>
            <span>运输箱</span>
            <strong id="boxCount">0</strong>
          </div>
          <div>
            <span>已装箱片段</span>
            <strong id="packedCount">0</strong>
          </div>
          <div>
            <span>待装 / 待检</span>
            <strong id="pendingCount">0 / 0</strong>
          </div>
          <div>
            <span>防潮剂(袋)</span>
            <strong id="desiccantCount">0</strong>
          </div>
        </div>
      </header>

      <section class="toolbar">
        <label>
          胶片卷
          <input id="reelTitle" type="text" placeholder="例：春日试映A卷" />
        </label>
        <label>
          搜索片段
          <input id="searchInput" type="search" placeholder="片段编号或备注" />
        </label>
        <label>
          运输箱状态
          <select id="boxStatusFilter">
            <option value="all">全部箱</option>
            <option value="open">待封箱</option>
            <option value="sealed">已封箱</option>
          </select>
        </label>
        <div class="toolbar-actions">
          <button id="newBoxBtn" class="primary">＋ 新建运输箱</button>
          <button id="exportBtn">导出装箱单</button>
        </div>
      </section>

      <section class="layout shipping-layout">
        <aside class="panel pool-panel">
          <div class="panel-head">
            <h2>片段池</h2>
          </div>
          <div class="pool-filters">
            <label>
              筛选
              <select id="poolFilter">
                <option value="all">全部片段</option>
                <option value="unboxed">未装箱</option>
                <option value="issue">破损 / 偏色</option>
                <option value="inspection">收货待检</option>
              </select>
            </label>
          </div>
          <div id="poolList" class="pool-list"></div>
        </aside>

        <section class="panel boxes-panel">
          <div class="panel-head">
            <h2>编号运输箱</h2>
            <span>条目按放映顺序排列；封箱后锁定</span>
          </div>
          <div id="boxList" class="box-list"></div>
        </section>

        <aside class="panel">
          <h2>装箱核对</h2>
          <div class="rail-block">
            <h3>待封箱问题</h3>
            <div id="railBlockers"></div>
          </div>
          <div class="rail-block">
            <h3>漏带片段</h3>
            <div id="railUnboxed"></div>
          </div>
          <div class="rail-block">
            <h3>收货待检</h3>
            <div id="railInspection"></div>
          </div>
          <p class="rule-note">
            破损、偏色或同一片段落入两箱的运输箱不能封箱；封箱后不可改动。收货发现新划痕或受潮时，只退回受影响片段，其余照常封存。
          </p>
        </aside>
      </section>
    </main>

    <script src="js/util.js"></script>
    <script src="js/store.js"></script>
    <script src="js/shipping.js"></script>
  </body>
</html>
